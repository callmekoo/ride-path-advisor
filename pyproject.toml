[project]
name = "rpa"
version = "0.1.0"
description = "Personal cycling route advisor: OSM graph + own ride history"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "numpy>=2.5",
    "scipy>=1.18",
    "osmium>=4.3",
    "typer>=0.29",
    "rpa-kernel",
    "shapely>=2.2",
    "httpx[socks]>=0.28",
    "pydantic>=2.12",
    "pyvalhalla>=3.9",
    "fitdecode>=0.10",
    "pyproj>=3.8",
    "rasterio>=1.5",
    "fastapi>=0.162.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rpa = "rpa.cli:app"

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv.workspace]
members = ["kernel"]

[tool.uv.sources]
rpa-kernel = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9",
    "hypothesis>=6.170",
    "httpx2>=2.16.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
